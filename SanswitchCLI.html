<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>switch:~# Brocade SAN CLI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0806;
    --bg-darker: #050402;
    --phosphor: #ffb000;
    --phosphor-bright: #ffd060;
    --phosphor-dim: #7a5a20;
    --phosphor-faint: #3a2810;
    --glow: rgba(255, 176, 0, 0.45);
    --glow-strong: rgba(255, 208, 96, 0.7);
    --error: #ff5555;
    --success: #66ff99;
    --info: #66ccff;
    --magenta: #ff66cc;
    --warn: #ffcc00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
    color: var(--phosphor);
    -webkit-font-smoothing: none;
    font-smooth: never;
    user-select: none;
    cursor: text;
  }

  /* CRT screen curvature & vignette */
  .crt-frame {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%),
      radial-gradient(ellipse at center, #15100a 0%, #0a0806 70%, #000 100%);
    padding: 12px;
    display: flex;
    flex-direction: column;
  }

  .crt-screen {
    flex: 1;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,176,0,0.04), transparent 60%),
      linear-gradient(180deg, #0d0a07 0%, #0a0806 50%, #08060a 100%);
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      inset 0 0 60px rgba(255,176,0,0.08),
      inset 0 0 200px rgba(0,0,0,0.6),
      0 0 40px rgba(255,176,0,0.05);
    border: 1px solid #1a1408;
  }

  /* Phosphor scanlines */
  .crt-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 3px
    );
    pointer-events: none;
    z-index: 5;
    mix-blend-mode: multiply;
  }

  /* Moving scanline */
  .crt-screen::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 100px;
    background: linear-gradient(180deg, transparent 0%, rgba(255,176,0,0.04) 50%, transparent 100%);
    pointer-events: none;
    z-index: 6;
    animation: scanline-move 7s linear infinite;
    mix-blend-mode: screen;
  }

  @keyframes scanline-move {
    0% { top: -100px; }
    100% { top: 100%; }
  }

  /* Top status bar */
  .status-bar {
    position: relative;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: linear-gradient(180deg, rgba(255,176,0,0.08), transparent);
    border-bottom: 1px solid rgba(255,176,0,0.18);
    font-size: 12px;
    color: var(--phosphor-dim);
    letter-spacing: 0.04em;
  }

  .status-bar .left, .status-bar .right {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .led {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: led-pulse 2s ease-in-out infinite;
  }
  .led.amber { background: var(--warn); box-shadow: 0 0 6px var(--warn); }

  @keyframes led-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  /* Terminal body */
  .terminal {
    position: relative;
    z-index: 3;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 18px 4px;
    font-size: 14px;
    line-height: 1.4;
    scroll-behavior: smooth;
  }

  .terminal::-webkit-scrollbar { width: 8px; }
  .terminal::-webkit-scrollbar-track { background: transparent; }
  .terminal::-webkit-scrollbar-thumb {
    background: var(--phosphor-faint);
    border-radius: 4px;
  }

  /* Output line styles */
  .line {
    white-space: pre-wrap;
    word-break: break-all;
    text-shadow: 0 0 4px var(--glow);
    animation: line-appear 0.05s linear;
  }

  @keyframes line-appear {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .line.prompt-line {
    display: flex;
    align-items: baseline;
    gap: 0;
  }

  .line .cmd {
    color: var(--phosphor-bright);
    text-shadow: 0 0 6px var(--glow-strong);
  }

  .line.error { color: var(--error); text-shadow: 0 0 4px rgba(255,85,85,0.4); }
  .line.success { color: var(--success); text-shadow: 0 0 4px rgba(102,255,153,0.4); }
  .line.warn { color: var(--warn); }
  .line.info { color: var(--info); }
  .line.muted { color: var(--phosphor-dim); }
  .line.dim { color: var(--phosphor-dim); text-shadow: none; }
  .line.banner {
    color: var(--phosphor-bright);
    text-shadow: 0 0 8px var(--glow-strong);
    font-weight: 500;
  }
  .line.table-header {
    color: var(--phosphor-dim);
    border-bottom: 1px dashed rgba(255,176,0,0.2);
    margin-bottom: 2px;
  }

  /* Input area */
  .input-line {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: baseline;
    padding: 4px 18px 12px;
    font-size: 14px;
    min-height: 34px;
  }

  .prompt {
    color: var(--phosphor-bright);
    text-shadow: 0 0 6px var(--glow-strong);
    white-space: nowrap;
    margin-right: 8px;
  }

  .input-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    align-items: baseline;
  }

  .input-clone {
    position: absolute;
    left: 0;
    visibility: hidden;
    white-space: pre;
    color: var(--phosphor-bright);
  }

  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--phosphor-bright);
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    caret-color: transparent;
    text-shadow: 0 0 6px var(--glow-strong);
    padding: 0;
    z-index: 2;
  }

  /* Custom cursor */
  .cursor {
    display: inline-block;
    width: 9px;
    height: 16px;
    background: var(--phosphor-bright);
    box-shadow: 0 0 6px var(--glow-strong), 0 0 12px var(--glow);
    animation: cursor-blink 1s steps(1) infinite;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1;
    pointer-events: none;
  }

  @keyframes cursor-blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  /* Boot fade overlay */
  .boot-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #000;
    pointer-events: none;
    animation: boot-fade 1.5s ease-out forwards;
    animation-delay: 0.3s;
  }

  @keyframes boot-fade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Power-on flicker */
  .crt-screen.power-on {
    animation: power-on 1.2s ease-out;
  }
  @keyframes power-on {
    0% { transform: scale(0.96); filter: brightness(2) saturate(0); opacity: 0; }
    8% { transform: scale(1.01); filter: brightness(2.2) saturate(0.2); opacity: 0.6; }
    15% { transform: scale(1); filter: brightness(1.5) saturate(0.6); opacity: 1; }
    25% { filter: brightness(0.9) saturate(0.9); }
    40% { filter: brightness(1.1) saturate(1); }
    100% { transform: scale(1); filter: brightness(1) saturate(1); opacity: 1; }
  }

  /* Hint bar */
  .hint-bar {
    position: relative;
    z-index: 4;
    padding: 5px 14px;
    background: rgba(0,0,0,0.4);
    border-top: 1px solid rgba(255,176,0,0.12);
    font-size: 11px;
    color: var(--phosphor-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 0.05em;
  }

  .hint-bar kbd {
    background: rgba(255,176,0,0.1);
    border: 1px solid rgba(255,176,0,0.25);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--phosphor);
    font-family: inherit;
    font-size: 10px;
    margin: 0 2px;
  }

  .hint-bar .tabs {
    display: flex;
    gap: 14px;
  }

  .hint-bar .tab {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.7;
  }
  .hint-bar .tab.active { opacity: 1; color: var(--phosphor); }

  /* Mobile */
  @media (max-width: 640px) {
    .terminal { font-size: 12px; padding: 6px 10px 2px; }
    .input-line { padding: 4px 10px 10px; font-size: 12px; }
    .status-bar { font-size: 10px; padding: 5px 8px; }
    .status-bar .right .meta { display: none; }
    .hint-bar { font-size: 10px; padding: 4px 8px; }
    .hint-bar .tabs { gap: 8px; }
  }
</style>
</head>

function generatePortStatus() {
  const ports = [];
  const states = ['Online', 'Online', 'Online', 'Online', 'Online', 'No_Sync', 'Online', 'Online',
                  'Online', 'Online', 'Disabled', 'Online', 'Online', 'No_Light', 'Online', 'Online',
                  'Online', 'Online', 'Online', 'Online', 'Online', 'Online', 'Online', 'Online'];
  for (let i = 0; i < 24; i++) {
    ports.push({
      index: i,
      wwn: `10:00:50:eb:1a:23:${(0x45 + i).toString(16).padStart(2,'0')}:00`,
      module: 'Combo (8G FC + 10G Eth)',
      state: states[i] || 'Online',
      speed: states[i] === 'Online' ? '8G' : '--',
      proto: 'FC',
      comment: ''
    });
  }
  return ports;
}

const term = document.getElementById('terminal');
const input = document.getElementById('cmd-input');
const promptText = document.getElementById('prompt-text');

const commandHistory = [];
let historyIdx = -1;
let busy = false;

function pad(str, n, ch = ' ') {
  str = String(str);
  return str.length >= n ? str : str + ch.repeat(n - str.length);
}
function padR(str, n, ch = ' ') {
  str = String(str);
  return str.length >= n ? str : ch.repeat(n - str.length) + str;
}

function print(text = '', cls = '') {
  const line = document.createElement('div');
  line.className = 'line' + (cls ? ' ' + cls : '');
  line.textContent = text;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
  return line;
}

function printHTML(html, cls = '') {
  const line = document.createElement('div');
  line.className = 'line' + (cls ? ' ' + cls : '');
  line.innerHTML = html;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
  return line;
}

function clearTerminal() {
  term.innerHTML = '';
}

function typePrint(text, cls = '', delay = 12) {
  return new Promise(resolve => {
    const line = document.createElement('div');
    line.className = 'line' + (cls ? ' ' + cls : '');
    term.appendChild(line);
    let i = 0;
    function step() {
      if (i < text.length) {
        line.textContent = text.slice(0, i + 1);
        term.scrollTop = term.scrollHeight;
        i++;
        setTimeout(step, delay);
      } else {
        resolve();
      }
    }
    step();
  });
}

async function typeLines(lines, opts = {}) {
  const { delay = 12, lineDelay = 30, clsMap = {} } = opts;
  for (const ln of lines) {
    if (typeof ln === 'object' && ln !== null) {
      await typePrint(ln.text, ln.cls || '', delay);
      if (lineDelay) await wait(lineDelay);
    } else {
      await typePrint(ln, '', delay);
      if (lineDelay) await wait(lineDelay);
    }
  }
}

function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function updatePrompt() {
  const user = switchState.currentUser || 'admin';
  promptText.textContent = `${switchState.switchName}:${user}> `;

function updateCursor() {
  // Position cursor based on text in input
  const val = input.value;
  inputClone.textContent = val.slice(0, input.selectionStart);
  const w = inputClone.offsetWidth;
  cursor.style.left = w + 'px';
  // Show cursor only at end (simple approach)
  if (input.selectionStart === val.length) {
    cursor.style.display = 'inline-block';
  } else {
    cursor.style.display = 'inline-block';
  }
}

// ---------- Argument Parsing ----------
function parseArgs(line) {
  // Split by spaces but respect quoted strings
  const tokens = [];
  let cur = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuote = !inQuote; continue; }
    if (c === ' ' && !inQuote) {
      if (cur) tokens.push(cur);
      cur = '';
    } else {
      cur += c;
    }
  }
  if (cur) tokens.push(cur);
  return tokens;
}

// ---------- Command Implementations ----------
function cmdHelp(args) {
  const target = args[0];
  const out = [];
  if (target && commands[target]) {
    out.push(`NAME`);
    out.push(`  ${target} - ${commands[target].desc}`);
    out.push('');
    out.push(`SYNOPSIS`);
    out.push(`  ${commands[target].usage}`);
    out.push('');
  } else {
    out.push('Available commands:');
    out.push('');
    const keys = Object.keys(commands).sort();
    for (const k of keys) {
      out.push(`  ${pad(k, 16)} ${commands[k].desc}`);
    }
    out.push('');
    out.push('Type "help <command>" for detailed usage.', 'dim');
  }
  return out;
}

function cmdLs(args) {
  const long = args.includes('-l');
  const files = Object.keys(filesystem);
  if (long) {
    const out = ['total ' + files.length, ''];
    for (const f of files) {
      const size = (filesystem[f].length / 1024).toFixed(2);
      out.push(`-rw-r--r--  admin  fabric   ${padR(size, 8)}K  Mar 15  ${f}`);
    }
    return out;
  }
  return [files.join('   ')];
}

function cmdCat(args) {
  if (!args[0]) return ['cat: missing file operand', '', 'Usage: cat <file>', ''];
  const fname = args[0];
  if (!filesystem[fname]) {
    return [`cat: ${fname}: No such file or directory`, ''];
  }
  return filesystem[fname].split('\n');
}

function parseArgsQuoted(args, expected) {
  // args is array after command name
  // Returns parsed values; handles "a", "b" form
  const joined = args.join(' ');
  const matches = joined.match(/"([^"]+)"/g);
  if (!matches) return [];
  return matches.map(m => m.replace(/"/g, ''));
}

function cmdAliCreate(args) {
  const parsed = parseArgsQuoted(args, 2);
  if (parsed.length < 2) return ['alicreate: missing arguments', '', 'Usage: alicreate "alias", "WWN"', 'Example: alicreate "srv01_hba0", "21:00:00:24:ff:12:34:01"', ''];
  const [alias, wwn] = parsed;
  if (switchState.aliases.find(a => a.name === alias)) {
    return [`alicreate: alias "${alias}" already exists`, ''];
  }
  if (!/^([0-9a-fA-F]{2}:){7}[0-9a-fA-F]{2}$/.test(wwn)) {
    return [`alicreate: invalid WWN format: ${wwn}`, 'WWN must be in format XX:XX:XX:XX:XX:XX:XX:XX', ''];
  }
  switchState.aliases.push({ name: alias, wwn });
  switchState.unsavedChanges = true;
  return [`Alias "${alias}" created for ${wwn}.`, '', 'Run cfgsave to persist this change.', ''];
}

function cmdAliDelete(args) {
  const parsed = parseArgsQuoted(args, 1);
  if (parsed.length < 1) return ['alidelete: missing arguments', '', 'Usage: alidelete "alias"', ''];
  const alias = parsed[0];
  const idx = switchState.aliases.findIndex(a => a.name === alias);
  if (idx === -1) return [`alidelete: alias "${alias}" not found`, ''];
  // Check if used in zones
  const usedIn = switchState.zones.filter(z => z.members.includes(alias));
  if (usedIn.length > 0) {
    return [`alidelete: cannot delete "${alias}", still in use by zones:`, ...usedIn.map(z => `  - ${z.name}`), '', 'Remove from zones first.', ''];
  }
  switchState.aliases.splice(idx, 1);
  switchState.unsavedChanges = true;
  return [`Alias "${alias}" deleted.`, ''];
}

function cmdZoneCreate(args) {
  const parsed = parseArgsQuoted(args, 2);
  if (parsed.length < 2) return ['zonecreate: missing arguments', '', 'Usage: zonecreate "zone", "member1; member2"', 'Members can be aliases or WWNs separated by semicolons', ''];
  const [zone, membersStr] = parsed;
  if (switchState.zones.find(z => z.name === zone)) {
    return [`zonecreate: zone "${zone}" already exists`, ''];
  }
  const members = membersStr.split(';').map(m => m.trim()).filter(Boolean);
  switchState.zones.push({ name: zone, members });
  switchState.unsavedChanges = true;
  return [`Zone "${zone}" created with members: ${members.join(', ')}`, ''];
}

function cmdZoneDelete(args) {
  const parsed = parseArgsQuoted(args, 1);
  if (parsed.length < 1) return ['zonedelete: missing arguments', '', 'Usage: zonedelete "zone"', ''];
  const zone = parsed[0];
  const idx = switchState.zones.findIndex(z => z.name === zone);
  if (idx === -1) return [`zonedelete: zone "${zone}" not found`, ''];
  // Remove from configs
  for (const cfg of switchState.configs) {
    const i = cfg.zones.indexOf(zone);
    if (i !== -1) cfg.zones.splice(i, 1);
  }
  switchState.zones.splice(idx, 1);
  switchState.unsavedChanges = true;
  return [`Zone "${zone}" deleted.`, '', 'Note: Removed from any configs that contained it.', ''];
}

function cmdZoneAdd(args) {
  const parsed = parseArgsQuoted(args, 2);
  if (parsed.length < 2) return ['zoneadd: missing arguments', '', 'Usage: zoneadd "zone", "member1; member2"', ''];
  const [zone, membersStr] = parsed;
  const z = switchState.zones.find(z => z.name === zone);
  if (!z) return [`zoneadd: zone "${zone}" not found`, ''];
  const members = membersStr.split(';').map(m => m.trim()).filter(Boolean);
  for (const m of members) {
    if (!z.members.includes(m)) z.members.push(m);
  }
  switchState.unsavedChanges = true;
  return [`Added members to zone "${zone}": ${members.join(', ')}`, ''];
}

function cmdZoneRemove(args) {
  const parsed = parseArgsQuoted(args, 2);
  if (parsed.length < 2) return ['zoneremove: missing arguments', '', 'Usage: zoneremove "zone", "member"', ''];
  const [zone, member] = parsed;
  const z = switchState.zones.find(z => z.name === zone);
  if (!z) return [`zoneremove: zone "${zone}" not found`, ''];
  const idx = z.members.indexOf(member);
  if (idx === -1) return [`zoneremove: member "${member}" not in zone "${zone}"`, ''];
  z.members.splice(idx, 1);

async function cmdFirmwareDownload(args) {

  input.disabled = true;
  cursor.style.display = 'none';

  const out = [];
  const lines = [
    `Connecting to ${host}...`,
    'Negotiating protocol...',
    'Protocol: SFTP',
    'Connected.',
    `Downloading firmware image v8.3.1 (FOS_v8.3.1.bin)...`,
  ];

  for (const l of lines) {
    print(l, 'dim');
    await wait(400);
  }

  // Progress bar
  const progLine = document.createElement('div');
  progLine.className = 'line';
  term.appendChild(progLine);
  for (let i = 0; i <= 100; i += 5) {
    const bar = '█'.repeat(i / 5) + '░'.repeat(20 - i / 5);
    progLine.textContent = `Progress: [${bar}] ${i}%   ${Math.round(125 * i / 100)} MB / 125 MB`;
    progLine.className = 'line';
    term.scrollTop = term.scrollHeight;

  }

  print('');
  await typePrint('Verifying image checksum...', 'dim', 8);
  await wait(400);
  await typePrint('Checksum: OK', 'success', 6);
  await wait(300);
  await typePrint('Image validated. Reboot required to apply.', 'warn', 6);
  print('');
  await typePrint('NOTE: Switch will reboot automatically.', 'warn', 6);
  await typePrint('Run "reboot" to schedule, or it will occur in 60s.', 'dim', 4);

  busy = false;
  input.disabled = false;
  cursor.style.display = 'inline-block';
  focusInput();
  return [];
}

// ---------- Execute Command ----------
async function executeCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;
  print(`${promptText.textContent}${trimmed}`, 'prompt-line');

  const tokens = parseArgs(trimmed);
  const cmd = tokens[0];
  const args = tokens.slice(1);

  if (!commands[cmd]) {
    print(`bash: ${cmd}: command not found`, 'error');
    print(`Type "help" to see available commands.`, 'dim');
    print('');
    return;
  }

  try {
    const result = await commands[cmd].fn(args);
    if (Array.isArray(result)) {
      for (const ln of result) {
        if (typeof ln === 'object' && ln !== null) {
          print(ln.text, ln.cls || '');
        } else {
          print(ln);
        }
      }
    }
  } catch (e) {
    print(`error: ${e.message}`, 'error');
  }
  updatePrompt();
}

// ---------- Tab Completion ----------
function tabComplete(val) {
  const tokens = val.split(/\s+/);
  // Command completion
  if (tokens.length === 1) {
    const partial = tokens[0];
    const matches = Object.keys(commands).filter(c => c.startsWith(partial));
    if (matches.length === 0) return val;
    if (matches.length === 1) return matches[0] + ' ';
    // Common prefix
    let prefix = matches[0];
    for (const m of matches) {
      let i = 0;
      while (i < prefix.length && prefix[i] === m[i]) i++;
      prefix = prefix.slice(0, i);
    }
    if (prefix.length > partial.length) return prefix;
    // Print options
    print(`${promptText.textContent}${val}`, 'prompt-line');
    print(matches.map(m => `  ${m}`).join('\n'), 'dim');
    print('');
    return val;
  }
  // Subcommand/alias completion for second arg
  const cmd = tokens[0];
  if (tokens.length === 2) {
    if (['alidelete', 'zoneadd', 'zoneremove', 'zonedelete', 'cfgadd', 'cfgremove', 'cfgenable', 'cfgdelete'].includes(cmd)) {
      const partial = tokens[1];
      let list = [];
      if (['alidelete', 'zoneadd', 'zoneremove'].includes(cmd)) list = switchState.aliases.map(a => a.name);
      if (cmd === 'zonedelete' || cmd === 'zoneadd' || cmd === 'zoneremove') list = switchState.zones.map(z => z.name);
      if (['cfgadd', 'cfgremove', 'cfgenable', 'cfgdelete'].includes(cmd)) list = switchState.configs.map(c => c.name);
      const matches = list.filter(n => n.startsWith(partial));
      if (matches.length === 1) return tokens[0] + ' ' + matches[0];
      if (matches.length > 1) {
        print(`${promptText.textContent}${val}`, 'prompt-line');
        print(matches.map(m => `  ${m}`).join('\n'), 'dim');
        print('');
      }
    }
  }
  return val;
}

// ---------- Input Handlers ----------
function handleKey(e) {
  if (busy) { e.preventDefault(); return; }

  if (e.key === 'Enter') {
    e.preventDefault();
    const val = input.value;
    input.value = '';
    updateCursor();
    if (val.trim()) {
      commandHistory.push(val);
      if (commandHistory.length > 100) commandHistory.shift();
    }
    historyIdx = -1;
    executeCommand(val);
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const newVal = tabComplete(input.value);
    input.value = newVal;
    updateCursor();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (commandHistory.length === 0) return;
    if (historyIdx === -1) historyIdx = commandHistory.length - 1;
    else if (historyIdx > 0) historyIdx--;
    input.value = commandHistory[historyIdx] || '';
    updateCursor();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx === -1) return;
    if (historyIdx < commandHistory.length - 1) {
      historyIdx++;
      input.value = commandHistory[historyIdx];
    } else {
      historyIdx = -1;
      input.value = '';
    }
    updateCursor();
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    clearTerminal();
  } else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    print(`${promptText.textContent}${input.value}^C`, 'prompt-line');
    input.value = '';
    updateCursor();
  } else if (e.key === 'u' && e.ctrlKey) {
    e.preventDefault();
    input.value = '';
    updateCursor();
  }
}

// ---------- Status bar updates ----------
function updateStatusBar() {
  // Session timer
  const elapsed = Math.floor((Date.now() - switchState.bootTime) / 1000);
  if (switchState.loggedIn) {
    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    sessionTimeEl.textContent = `SESSION ${h}:${m}:${s}`;
  }

  // Throughput (fake fluctuating)
  const tp = Math.floor(Math.random() * 800 + 200);
  throughputEl.textContent = `${tp} Mb/s`;
}
